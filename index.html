<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Larp Tech</title>
<meta name="description" content="Larp Tech">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap">
<style>
  :root { --bg: #08070f; --text: #f2f0fa; --muted: #8f89a8; --line: #241f3a; --accent: #a78bfa; }
  * { box-sizing: border-box; margin: 0; }
  html { color-scheme: dark; }
  body { min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: 'Space Grotesk', system-ui, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.5;
    background-image: radial-gradient(900px 500px at 50% -10%, rgba(124, 92, 214, .18), transparent 70%); background-repeat: no-repeat; }
  main { max-width: 520px; text-align: center; }
  h1 { font-size: clamp(34px, 7vw, 56px); letter-spacing: -.03em; line-height: 1.05; }
  p { color: var(--muted); margin-top: 14px; font-size: 17px; }
  a.btn { display: inline-block; margin-top: 28px; padding: 12px 22px; border-radius: 12px; border: 1px solid var(--line);
    background: #171427; color: var(--text); text-decoration: none; font-weight: 500; transition: border-color .15s, transform .15s; }
  a.btn:hover { border-color: var(--accent); transform: translateY(-1px); }
  footer { margin-top: 36px; font-size: 13px; color: #5d5878; }
</style>
</head>
<body>
<main>
  <h1>Larp Tech</h1>
  <p>Nothing much here yet. Check back soon.</p>
  <a class="btn" href="https://larphub.tech">Go to Larp Hub</a>
  <footer>larptech.com</footer>
</main>
</body>
</html>
